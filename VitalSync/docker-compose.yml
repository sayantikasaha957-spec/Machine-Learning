services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vitalsync-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=VitalSync
      - API_V1_STR=/api/v1
      - SECRET_KEY=vitalsync-docker-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:8000", "http://127.0.0.1:5173"]
      - DATABASE_URL=sqlite:///./vitalsync.db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENVIRONMENT=production
      - DEBUG=False
    volumes:
      - vitalsync_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vitalsync-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vitalsync_db:
    name: vitalsync_data
